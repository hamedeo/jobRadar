name: Check for new jobs

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check career websites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Commit updated job history
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "No job history changes."
            exit 0
          fi

          git config user.name "job-radar-bot"
          git config user.email \
            "job-radar-bot@users.noreply.github.com"

          git add data/seen_jobs.json
          git commit -m "Update seen job history"
          git push
